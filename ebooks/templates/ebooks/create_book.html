{% extends 'ebooks/base.html' %}

{% block title %}Create New eBook - eBook Studio{% endblock %}

{% block content %}
<div class="p-5" style="text-align: left; max-width: 600px; margin: 0 auto;">
    <h2>Create a New eBook</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn w-100">Create & Start Writing</button>
    </form>
</div>
{% endblock %}
