{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}eBook Studio{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'ebooks/style.css' %}">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="{% url 'home' %}">📚 eBook Studio</a>

            <ul class="navbar-nav" style="align-items: center;">
                <li><a class="nav-link" href="{% url 'home' %}">Home</a></li>
                <li><a class="nav-link" href="{% url 'gallery' %}">Template Gallery</a></li>
                <li><a class="nav-link" href="{% url 'pricing' %}">Pricing</a></li>
                {% if user.is_authenticated %}
                    <li><a class="nav-link" href="{% url 'my_books' %}">My Books</a></li>
                    <li>
                        <form method="POST" action="{% url 'logout' %}" style="margin: 0;">
                            {% csrf_token %}
                            <button type="submit" class="nav-link" style="background: none; border: none; cursor: pointer; font-size: 1rem;">
                                Log Out ({{ user.username }}{% if user.profile.is_pro %} ⭐{% endif %})
                            </button>
                        </form>
                    </li>
                {% else %}
                    <li><a class="nav-link" href="{% url 'login' %}">Log In</a></li>
                    <li><a class="nav-link" href="{% url 'signup' %}">Sign Up</a></li>
                {% endif %}
            </ul>

        </div>
    </nav>

    <main class="container my-5">
        {% block content %}{% endblock %}
    </main>

</body>
</html>
